name: Memory.Nrul Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run build

      - name: AI flow test
        run: npm run test:ai

      - name: Voice flow test
        run: npm run test:voice

      - name: Prepare Worker secrets
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MEMORY_ADMIN_KEY: ${{ secrets.MEMORY_ADMIN_KEY }}
        run: |
          set -euo pipefail
          test -n "$GROQ_API_KEY" || { echo "GROQ_API_KEY is missing from GitHub Environment 'production'"; exit 1; }
          test -n "$MEMORY_ADMIN_KEY" || { echo "MEMORY_ADMIN_KEY is missing from GitHub Environment 'production'"; exit 1; }
          {
            printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY"
            printf 'MEMORY_ADMIN_KEY=%s\n' "$MEMORY_ADMIN_KEY"
          } > .worker-secrets

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.jsonc --secrets-file .worker-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Remove Worker secrets file
        if: always()
        run: rm -f .worker-secrets
